<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#f43f5e" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Big Red Heart -->
  <path d="M100 170 C20 110, 10 50, 60 25 C85 10, 100 35, 100 35 C100 35, 115 10, 140 25 C190 50, 180 110, 100 170 Z" fill="#ff4d6d" filter="url(#soft-glow)"/>
  <!-- Highlight -->
  <path d="M50 40 C40 55, 42 75, 48 85" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- Cute Bear Paws Peeking -->
  <ellipse cx="65" cy="110" rx="14" ry="12" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <ellipse cx="135" cy="110" rx="14" ry="12" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <!-- Bear Ears -->
  <circle cx="55" cy="45" r="16" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <circle cx="55" cy="45" r="9" fill="#ffd1dc"/>
  <circle cx="145" cy="45" r="16" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <circle cx="145" cy="45" r="9" fill="#ffd1dc"/>
  <!-- Bear Head -->
  <circle cx="100" cy="55" r="32" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <!-- Eyes -->
  <circle cx="90" cy="52" r="3.5" fill="#1e293b"/>
  <circle cx="110" cy="52" r="3.5" fill="#1e293b"/>
  <!-- Blush -->
  <circle cx="83" cy="60" r="5" fill="#ff9ebb" opacity="0.8"/>
  <circle cx="117" cy="60" r="5" fill="#ff9ebb" opacity="0.8"/>
  <!-- Mouth -->
  <path d="M96 60 Q100 64 104 60" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
</svg>